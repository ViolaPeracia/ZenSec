version: 2

updates:
  # Group golang.org/x/* so crypto / term / sys bump in one PR. They share a
  # release cadence and a single bump avoids a transient state where one x/ pkg
  # is newer than its dependents.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns:
          - 'golang.org/x/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly